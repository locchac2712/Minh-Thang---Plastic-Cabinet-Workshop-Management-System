spring:
  application:
    name: tuplastic-erp

  datasource:
    # Khớp docker-compose: Postgres publish ra host cổng 5434
    url: jdbc:postgresql://localhost:5434/tuplastic_erp
    # Khớp docker-compose (POSTGRES_*); prod: đặt trong env / secret, không commit mật khẩu thật.
    username: ${POSTGRES_USER:tuplastic}
    password: ${POSTGRES_PASSWORD:TuPlasticDb-local-dev-CHANGE_ME_7xK9mP2q}
    driver-class-name: org.postgresql.Driver
    hikari:
      # VPS / ổ đĩa chậm: tránh fail nhanh trước khi Postgres sẵn sàng
      connection-timeout: 60000
      maximum-pool-size: 10

  jpa:
    # Khi JDBC metadata tạm thời không có (DB chưa listen, sai URL…), vẫn chọn dialect PostgreSQL
    database: postgresql
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  # Origin trình duyệt (FE + Swagger UI khi mở trên cùng host API). Phân tách bằng dấu phẩy.
  # Swagger tại https://api-be... gửi Origin https://api-be... — bắt buộc có origin đó.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://minhthangerp.space,https://www.minhthangerp.space,https://api-be.minhthangerp.space,http://api-be.minhthangerp.space}

  jwt:
    secret: THAY-DOI-SECRET-NAY-TRUOC-KHI-DEPLOY-PRODUCTION-MIN-256-BIT-KEY-HERE-1234567890
    expiration-ms: 86400000  # 24 hours
  openapi:
    # Swagger UI "Servers"; override khi deploy: OPENAPI_SERVER_URL=https://...
    server-url: ${OPENAPI_SERVER_URL:https://api-be.minhthangerp.space}

  mail:
    # From địa chỉ hiển thị (không chứa mật khẩu; thường trùng username Gmail SMTP)
    from: ${APP_MAIL_FROM:}

  password-reset:
    # FE mở màn nhập MK mới, query ?token=
    frontend-url: ${APP_PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
    # Thời hạn token (ms), mặc định 1 giờ
    token-validity-ms: ${APP_PASSWORD_RESET_TOKEN_VALIDITY_MS:3600000}

  task-tracking:
    # Link public theo dõi lô SX — base URL FE (không path)
    frontend-url: ${APP_TASK_TRACKING_FRONTEND_URL:http://localhost:5173}
    # Thời hạn token (ms), mặc định 90 ngày
    token-validity-ms: ${APP_TASK_TRACKING_TOKEN_VALIDITY_MS:7776000000}

  receivables:
    warning:
      # Anchor + due-grace-days = đến hạn ước lượng (không có due_date trong DB vòng này)
      due-grace-days: ${APP_RECEIVABLES_WARNING_DUE_GRACE_DAYS:30}

  notifications:
    # Nhắc seller khi đơn Done còn dư thu, trước hạn N ngày.
    payment-deadline-days: ${APP_NOTIFICATIONS_PAYMENT_DEADLINE_DAYS:3}
    # Mốc kết ca để kiểm tra thiếu nhật ký NVL/activity của lệnh Doing.
    shift-end-hour: ${APP_NOTIFICATIONS_SHIFT_END_HOUR:17}
    # Cron chạy cảnh báo tồn thấp.
    low-stock-cron: ${APP_NOTIFICATIONS_LOW_STOCK_CRON:0 0 * * * *}
    # Cron chạy nhắc hạn thanh toán.
    deadline-cron: ${APP_NOTIFICATIONS_DEADLINE_CRON:0 0 8 * * *}
    # Cron chạy sau ca làm việc để rà lệnh thiếu ghi nhận.
    shift-check-cron: ${APP_NOTIFICATIONS_SHIFT_CHECK_CRON:0 5 17 * * *}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:YOUR_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY:YOUR_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET:YOUR_API_SECRET}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
